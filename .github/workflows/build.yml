name: Build BlackBox Enhanced APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Accept Android SDK License
      run: yes | sdkmanager --licenses || true
      
    - name: Install Android SDK Components
      run: |
        sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
        
    - name: Generate Keystore for Signing
      run: |
        keytool -genkeypair -v \
          -keystore release.keystore \
          -alias blackbox \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android123 \
          -keypass android123 \
          -dname "CN=BlackBox Enhanced, OU=Dev, O=BlackBox, L=Unknown, ST=Unknown, C=ID"
          
    - name: Make Gradlew executable
      run: chmod +x ./gradlew
      
    - name: Clean project
      run: ./gradlew clean
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Prepare Universal APKs
      run: |
        echo "=== Preparing Universal APKs ==="
        
        # Find universal APKs only
        DEBUG_APK=$(find app/build/outputs/apk/debug -name "*universal-debug.apk" | head -1)
        RELEASE_APK=$(find app/build/outputs/apk/release -name "*universal-release.apk" | head -1)
        
        echo "Debug APK: $DEBUG_APK"
        echo "Release APK: $RELEASE_APK"
        
        # Copy with proper names
        if [ -n "$DEBUG_APK" ]; then
          cp "$DEBUG_APK" ./BlackBox-Enhanced-v0.0.8-debug.apk
          echo "✅ Debug APK ready"
        fi
        
        if [ -n "$RELEASE_APK" ]; then
          cp "$RELEASE_APK" ./BlackBox-Enhanced-v0.0.8-release.apk
          echo "✅ Release APK ready"
        fi
        
        echo ""
        echo "=== APKs ready ==="
        ls -la *.apk 2>/dev/null
        
    - name: Delete Old Release
      run: |
        gh release delete v0.0.8 --repo ${{ github.repository }} --yes 2>/dev/null || true
        git tag -d v0.0.8 2>/dev/null || true
        git push origin :refs/tags/v0.0.8 2>/dev/null || true
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: "BlackBox Enhanced v0.0.8"
        tag_name: "v0.0.8"
        body: |
          ## BlackBox Enhanced v0.0.8
          
          **Enhanced by Panxcz & Freebuff** | Original by ALEX502
          
          ### 📱 What's New
          - App Dumper (dump.cs, il2cpp.h, main.h, game.h)
          - Shell script execution (.sh support)
          - Google login integration
          - Advanced root hiding (Kernel-level)
          - VPN hiding
          - Enhanced fake location with GPS simulation
          - SafetyNet/Play Integrity bypass
          - Frida/Xposed/Substrate detection bypass
          - Hook detection bypass
          - Android 5.0 - 17 support
          
          ### 📱 App Dumper Features
          - IL2CPP dump (dump.cs, il2cpp.h)
          - Unity game dump (main.h, game.h)
          - DEX extraction
          - Native SO analysis
          - Class/method enumeration
          - String dump
          - Custom output options
          
          ### 📲 Installation
          1. Download the **universal** APK below
          2. Enable "Unknown Sources" in settings
          3. Install and enjoy!
          
          ### 🙏 Credits
          - Original: ALEX502
          - Enhanced by: Panxcz & Freebuff
          
          ### 📝 Note
          - Only universal APK uploaded (works on all architectures)
          - APK is auto-signed with RSA-2048
        files: |
          BlackBox-Enhanced-v0.0.8-debug.apk
          BlackBox-Enhanced-v0.0.8-release.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: BlackBox-Enhanced-v0.0.8
        path: "*.apk"
        retention-days: 90
        if-no-files-found: warn
        
    - name: Build Summary
      run: |
        echo "## 🎉 Build Summary - BlackBox Enhanced v0.0.8" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Build Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📱 Universal APK Only" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Debug APK**: BlackBox-Enhanced-v0.0.8-debug.apk" >> $GITHUB_STEP_SUMMARY
        echo "- **Release APK**: BlackBox-Enhanced-v0.0.8-release.apk" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Download" >> $GITHUB_STEP_SUMMARY
        echo "[GitHub Release](https://github.com/${{ github.repository }}/releases/tag/v0.0.8)" >> $GITHUB_STEP_SUMMARY
